# Dependabot does not open routine version-update pull requests here:
# open-pull-requests-limit: 0 switches them off for every ecosystem below. Security
# updates are turned on in the repository settings and are not limited by this value.
# Listing the ecosystems keeps Dependabot pointed at the right manifests for those.
version: 2
updates:
  - package-ecosystem: npm
    directory: /services/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /services/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /services/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /services/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
