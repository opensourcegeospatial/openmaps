# Pushing a tag like v1.2.3 builds both images for amd64 and arm64, publishes them to the
# GitHub Container Registry and creates a GitHub release with generated notes. A tag with
# a hyphen (v1.2.3-rc.1) is a pre-release: it does not move the "latest" image tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create
  packages: write # push to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    # The arm64 half of both builds runs under emulation and is slow.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Registry paths must be lowercase, and the owner name may not be.
      - name: Image names
        id: names
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          {
            echo "frontend=ghcr.io/${owner}/openmaps-frontend"
            echo "backend=ghcr.io/${owner}/openmaps-backend"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tags are the version without the "v", and latest. The labels include
      # org.opencontainers.image.source, which ties the package to this repository.
      - name: Frontend image tags
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.frontend }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=openmaps-frontend

      # provenance: false keeps the multi-arch index to the two platforms, with no
      # extra attestation entry showing up as unknown/unknown.
      - name: Build and push the frontend image
        uses: docker/build-push-action@v6
        with:
          context: services/frontend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Backend image tags
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.backend }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=openmaps-backend

      # The slim image: no torch, no transformers.
      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: services/backend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: WITH_ML=false
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--generate-notes)
          if [[ $GITHUB_REF_NAME == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
