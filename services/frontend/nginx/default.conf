# OpenMaps frontend: nginx site config. Copied to /etc/nginx/conf.d/default.conf
# by the runtime stage of ./Dockerfile, so it can be edited and the image
# rebuilt without touching the application code.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. nginx does NOT inherit add_header into a location that
    # sets its own, so every location below repeats these two.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Vite's content-hashed bundles are the only files safe to cache forever.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Other static files (icons, marker images) are not content-hashed: let the
    # browser revalidate so a redeploy that changes them is picked up.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # index.html references the current hashed bundle: never let a stale copy
    # outlive a redeploy (the SPA fallback below serves it for every route).
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Runtime config.json (never cache - regenerated on container start)
    location = /config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Proxy API requests to the backend service.
    # ^~ : a prefix match that regex locations (the static-asset cache rule
    # below) can never shadow, so an /api/ path ending in .png/.pbf is still
    # proxied rather than served (404) from the web root.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The natural-language Overpass search runs a byt5 model on CPU and can
        # take minutes; the SPA waits 5 min (src/lib/overpass.ts) and the
        # backend 10 min. nginx's default 60 s would answer 504 in between.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Proxy tile requests to tileserver-gl (renders vector tiles as PNG)
    location ^~ /tiles/ {
        resolver 127.0.0.11 valid=30s;
        set $tileserver http://tileserver:8080;
        rewrite ^/tiles/(.*)$ /styles/basic-preview/$1 break;
        proxy_pass $tileserver;
        proxy_set_header Host $host;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
